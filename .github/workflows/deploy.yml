name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC -> AWS IAM role (no long-lived keys)
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
  TF_VAR_ses_sender_email: ${{ vars.SES_SENDER_EMAIL }}
  TF_VAR_ses_verify_emails: ${{ vars.SES_VERIFY_EMAILS || '[]' }}
  # exam_mode, DB class and campus CIDRs live in infra/prod.auto.tfvars, so changing them is a commit + push to main.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend unit tests
        working-directory: backend
        run: npm ci && npm test
      - name: Frontend syntax check
        run: node --check frontend/app.js
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Terraform fmt / validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive || echo "::warning::Run 'terraform fmt -recursive' in infra/"
          terraform init -backend=false
          terraform validate

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Lambda bundle (production deps only)
        working-directory: backend
        run: npm ci --omit=dev

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply (main only)
        if: github.event_name != 'pull_request'
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan

      - name: Migrate database (runs inside the VPC)
        if: github.event_name != 'pull_request'
        run: |
          FN=$(terraform -chdir=infra output -raw migrate_function)
          aws lambda invoke --function-name "$FN" --cli-binary-format raw-in-base64-out \
            --payload '{"seed":true}' migrate-out.json
          cat migrate-out.json
          if grep -q errorMessage migrate-out.json; then exit 1; fi

      - name: Deploy frontend
        if: github.event_name != 'pull_request'
        run: |
          cd infra
          cat > ../frontend/config.js <<EOF
          window.APP_CONFIG = {
            region: '$(terraform output -raw region)',
            userPoolClientId: '$(terraform output -raw user_pool_client_id)',
            cognitoDomain: '$(terraform output -raw cognito_domain)',
            apiBase: ''
          };
          EOF
          BUCKET=$(terraform output -raw frontend_bucket)
          DIST=$(terraform output -raw cloudfront_distribution_id)
          cd ..
          aws s3 sync frontend/ "s3://$BUCKET/" --delete --exclude "config.example.js"
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"

      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          URL=$(terraform -chdir=infra output -raw site_url)
          for i in 1 2 3 4 5 6; do
            curl -fsS "$URL/api/health" && exit 0
            sleep 20
          done
          exit 1
